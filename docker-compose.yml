name: auditor-pep

services:
  redis:
    container_name: auditor-pep-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --appendonly yes
    restart: unless-stopped

  worker:
    container_name: auditor-pep-worker
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
      # The OpenAI-compatible route: LMStudio's own /api/v1/chat answers 400 to a "seed".
      - LMSTUDIO_URL=http://host.docker.internal:1234/v1/chat/completions
      # Greedy decoding is what makes an audit reproducible; the seed (sent by the evaluation
      # notebook per batch) documents it. Do not change these mid-study.
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0}
      - AI_TOP_K=${AI_TOP_K:-1}
      - AI_TOP_P=${AI_TOP_P:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data_extract:/app/data_extract
    restart: unless-stopped

  producer:
    container_name: auditor-pep-producer
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - SQLITE_DB_PATH=/app/data/auditor.db
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@auditor.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - EVAL_API_TOKEN=${EVAL_API_TOKEN:-}
    volumes:
      - audit-data:/app/data
    restart: unless-stopped

volumes:
  audit-data:
